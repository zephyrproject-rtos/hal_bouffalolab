#
# Pin codes:
#
# - BL808C 88-pin (40 GPIO)
# - BL808D 88-pin (36 GPIO)

model: bflb,bl

family: bl808

map: BFLB_PINMUX

series: [808]

peripherals:
    - [sdh, 0]
    - [spi, 1, 0]
    - [flash, 2, 0, 1, 2]
    - [i2s, 3]
    - [pdm, 4]
    - [i2c, 5, 0]
    - [i2c, 6, 1]
    - [uart, 7, 0, 1, 2]
    - [emac, 8]
    - [cam, 9]
    - [analog, 10]
    - [adc, 10]
    - [dac, 10]
    - [swgpio, 11]
    - [gpio, 11]
    - [pwm, 16, 0]
    - [pwm, 17, 1]
    - [spi, 18, 1] # mm_spi
    - [i2c, 19, 2] # mm_i2c0
    - [i2c, 20, 3] # mm_i2c1
    - [mm_uart, 21]
    - [dbi_b, 22]
    - [dbi_c, 23]
    - [dpi, 24]
    - [jtag_lp, 25]
    - [jtag_m0, 26]
    - [jtag_d0, 27]
    - [clock_out, 31, 0, 1, 2, 3]

signals:
    # UART signals
    - [rts, 0]
    - [cts, 1]
    - [tx, 2]
    - [rx, 3]
    # Clock out signals
    - [cam_ref, 0]
    - [i2s_ref, 1]
    - [clk_audio_adc, 2]
    - [clk_audio_dac, 3]
    - [xtal, 2]
    - [wifipll_32m, 3]
    - [wifipll_48m, 3]

